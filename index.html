<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Yotpo Sandbox Pro</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    overflow: hidden;
    font-family: Arial;
  }

  /* LEFT */
  #left {
    width: 420px;
    min-width: 240px;
    background: #fafafa;
    padding: 12px;
    overflow-y: auto;
  }

  /* SPLITTER */
  #divider {
    width: 6px;
    cursor: col-resize;
    background: #ddd;
  }

  #divider:hover {
    background: #aaa;
  }

  /* RIGHT */
  #right {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #toolbar {
    padding: 6px 10px;
    background: #f3f3f3;
    font-size: 12px;

    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  iframe {
    flex: 1;
    border: none;
    min-height: 0;
    width: 100%;
  }
  #previewWrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    overflow: auto;
    background: #f9f9f9;
    width: 100%;
  }

  #previewWrapper {
    transition: width 0.2s ease;
  }

  #frame {
    width: 100%;
    height: 100%;
    border: none;
    transition: width 0.2s ease;
  }

  input#appKey, input#lang {
    width: 95%;
  }

  input, button {
    width: 100%;
    padding: 6px;
    margin: 4px 0;
  }

  .box {
    background: white;
    border: 1px solid #ddd;
    padding: 10px;
    margin-bottom: 10px;
    padding-right: 25px;
  }

  #deviceBar {
    display: flex;
    gap: 6px;
  }

  #deviceBar button {
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
    border: 1px solid #ccc;
    background: white;
  }

  #deviceBar button:hover {
    background: #eee;
  }

  #deviceBar button {
    width: 100px;
  }

  #editorToggleBar {
    padding: 6px;
    background: #f3f3f3;
    border-top: 1px solid #ddd;
  }

  #codeEditorPanel {
    height: 200px;
    border-top: 1px solid #ddd;
  }

  #codeEditor {
    width: 100%;
    height: 100%;
    border: none;
    resize: none;
    font-family: monospace;
    font-size: 12px;
    padding: 10px;
    box-sizing: border-box;
  }

  .hidden {
    display: none;
  }

  #shareLinkBox input {
    font-size: 11px;
    color: #444;
  }

  #shareLinkStatus {
    font-size: 11px;
    color: #2a7d2a;
    height: 14px;
  }
</style>
</head>

<body>

<!-- LEFT PANEL -->
<div id="left">

  <h3>Yotpo Sandbox</h3>

  <input id="appKey" placeholder="App Key">
  <input id="lang" placeholder="Language Code (optional)">

  <button onclick="generate()">Generate</button>

  <div class="box hidden" id="shareLinkBox">
    <label>🔗 Shareable Link</label>
    <input id="shareLinkInput" readonly onclick="this.select()">
    <button onclick="copyShareLink()">Copy Link</button>
    <div id="shareLinkStatus"></div>
  </div>

  <div class="box">
    <label>⭐ Star Rating</label>
    <input id="starInstance" placeholder="Star Instance ID">
    <input id="starProduct" placeholder="Product ID">
  </div>

  <div class="box">
    <label>📝 Reviews</label>
    <input id="reviewInstance" placeholder="Review Instance ID">
    <input id="reviewProduct" placeholder="Product ID">
  </div>

<hr>

<h3>Additional Widgets</h3>

<div id="widgetsContainer"></div>

<button onclick="addWidget()" style="width:100%; padding:10px;">
  + Add Widget
</button>
</div>

<!-- DRAG HANDLE -->
<div id="divider"></div>

<!-- RIGHT PANEL -->
<div id="right">
  <div id="toolbar">
    <div class="title">Preview</div>
    <div id="deviceBar">
      <button onclick="setDevice(375)">📱 Mobile</button>
      <button onclick="setDevice(768)">📟 Tablet</button>
      <button onclick="setDevice(1024)">💻 Desktop</button>
      <button onclick="resetLayout()">🔄 Reset</button>
    </div>
  </div>

  <div id="previewWrapper">
    <iframe id="frame"></iframe>
  </div>

  <!-- FOOTER TOOLBAR -->
  <div id="editorToggleBar">
    <button onclick="toggleEditor()">🧠 Code Editor</button>
  </div>

  <!-- EDITOR PANEL -->
  <div id="codeEditorPanel" class="hidden">
    <textarea
      id="codeEditor"
      placeholder="Add custom CSS, JS, or HTML here..."
    ></textarea>
  </div>

</div>
<script>
function escapeAttr(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;");
}

function addWidget(name = "", instance = "", product = "") {
  const container = document.getElementById("widgetsContainer");

  const div = document.createElement("div");
  div.className = "box";

  div.innerHTML = `
    <input class="name" placeholder="Widget Name (e.g. SEO Widget)" value="${escapeAttr(name)}">

    <input class="instance" placeholder="Instance ID" value="${escapeAttr(instance)}">
    <input class="product" placeholder="Product ID" value="${escapeAttr(product)}">

    <button onclick="this.parentElement.remove()" style="margin-top:5px;">
      Remove
    </button>
  `;

  container.appendChild(div);
}

function widget(instance, productId) {
  return `
    <div class="yotpo-widget-instance"
      data-yotpo-instance-id="${instance}"
      data-yotpo-product-id="${productId}">
    </div>
  `;
}

function generate() {
  const appKey = document.getElementById("appKey").value;
  const lang = document.getElementById("lang").value;

  const customCode = document.getElementById("codeEditor").value;

  let widgets = "";

  /* DEFAULT STAR */
  const starInstance = document.getElementById("starInstance")?.value;
  const starProduct = document.getElementById("starProduct")?.value;

  if (starInstance) {
    widgets += `
      <div class="yotpo-widget-instance"
        data-yotpo-instance-id="${starInstance}"
        data-yotpo-product-id="${starProduct}">
      </div>
    `;
  }

  /* DEFAULT REVIEWS */
  const reviewInstance = document.getElementById("reviewInstance")?.value;
  const reviewProduct = document.getElementById("reviewProduct")?.value;

  if (reviewInstance) {
    widgets += `
      <div class="yotpo-widget-instance"
        data-yotpo-instance-id="${reviewInstance}"
        data-yotpo-product-id="${reviewProduct}">
      </div>
    `;
  }

  /* ADDITIONAL WIDGETS */
  const blocks = document.querySelectorAll("#widgetsContainer .box");

  blocks.forEach(block => {
    const instance = block.querySelector(".instance").value;
    const product = block.querySelector(".product").value;

    if (!instance) return;

    widgets += `
      <div class="yotpo-widget-instance"
        data-yotpo-instance-id="${instance}"
        data-yotpo-product-id="${product}">
      </div>
    `;
  });

  const langParam = lang
    ? `?languageCode=${lang}`
    : "";

  const scriptTag = appKey
    ? `<script src="https://cdn-widgetsrepository.yotpo.com/v1/loader/${appKey}${langParam}" async><\/script>`
    : "";

  const html = `
<!DOCTYPE html>
<html>
<head>
  ${scriptTag}

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    .yotpo-widget-instance {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  ${widgets}
  ${customCode}
</body>
</html>
  `;
  document.getElementById("frame").srcdoc = html;

  updateShareLink();
}

/* ===================== SHAREABLE LINK ===================== */

function serializeConfig() {
  const widgets = [];

  document.querySelectorAll("#widgetsContainer .box").forEach(block => {
    widgets.push({
      name: block.querySelector(".name")?.value || "",
      instance: block.querySelector(".instance")?.value || "",
      product: block.querySelector(".product")?.value || ""
    });
  });

  return {
    appKey: document.getElementById("appKey").value,
    lang: document.getElementById("lang").value,
    starInstance: document.getElementById("starInstance")?.value || "",
    starProduct: document.getElementById("starProduct")?.value || "",
    reviewInstance: document.getElementById("reviewInstance")?.value || "",
    reviewProduct: document.getElementById("reviewProduct")?.value || "",
    widgets,
    customCode: document.getElementById("codeEditor").value
  };
}

function encodeConfig(cfg) {
  const json = JSON.stringify(cfg);
  return btoa(unescape(encodeURIComponent(json)));
}

function decodeConfig(str) {
  try {
    const json = decodeURIComponent(escape(atob(str)));
    return JSON.parse(json);
  } catch (e) {
    console.warn("Yotpo Sandbox: could not parse shared link config", e);
    return null;
  }
}

function applyConfig(cfg) {
  if (!cfg) return;

  document.getElementById("appKey").value = cfg.appKey || "";
  document.getElementById("lang").value = cfg.lang || "";
  document.getElementById("starInstance").value = cfg.starInstance || "";
  document.getElementById("starProduct").value = cfg.starProduct || "";
  document.getElementById("reviewInstance").value = cfg.reviewInstance || "";
  document.getElementById("reviewProduct").value = cfg.reviewProduct || "";
  document.getElementById("codeEditor").value = cfg.customCode || "";

  document.getElementById("widgetsContainer").innerHTML = "";
  (cfg.widgets || []).forEach(w => addWidget(w.name, w.instance, w.product));

  generate();
}

function buildShareUrl() {
  const encoded = encodeConfig(serializeConfig());
  return `${location.origin}${location.pathname}#s=${encoded}`;
}

function updateShareLink() {
  const url = buildShareUrl();

  /* Keep the address bar in sync so the current URL is always shareable too */
  try {
    history.replaceState(null, "", url);
  } catch (e) {
    /* ignored — e.g. file:// or sandboxed contexts may block this */
  }

  const box = document.getElementById("shareLinkBox");
  const input = document.getElementById("shareLinkInput");

  if (box && input) {
    box.classList.remove("hidden");
    input.value = url;
  }
}

async function copyShareLink() {
  const input = document.getElementById("shareLinkInput");
  const status = document.getElementById("shareLinkStatus");
  const url = (input && input.value) || buildShareUrl();

  try {
    await navigator.clipboard.writeText(url);
  } catch (e) {
    /* Clipboard API unavailable (e.g. insecure context) — fall back to manual select */
    if (input) {
      input.select();
      document.execCommand("copy");
    }
  }

  if (status) {
    status.textContent = "Link copied!";
    setTimeout(() => (status.textContent = ""), 2000);
  }
}

function loadFromShareLink() {
  const hash = location.hash;

  if (!hash.startsWith("#s=")) return;

  const cfg = decodeConfig(hash.slice(3));
  if (cfg) applyConfig(cfg);
}

/* SPLITTER FOR RESIZING PREVIEW */
const divider = document.getElementById("divider");
const left = document.getElementById("left");

/* Save default width so reset works */
function setDevice(width) {
  const wrapper = document.getElementById("previewWrapper");

  wrapper.style.width = width + "px";
  wrapper.style.margin = "0 auto";
}

function resetLayout() {
  const wrapper = document.getElementById("previewWrapper");

  wrapper.style.width = "100%";
  wrapper.style.margin = "0";
}


let isDragging = false;

const MIN = 240;

divider.addEventListener("mousedown", () => {
  isDragging = true;
  document.body.style.cursor = "col-resize";
});

document.addEventListener("mousemove", (e) => {
  if (!isDragging) return;

  const max = window.innerWidth - 200; // keeps preview usable
  let width = e.clientX;

  if (width < MIN) width = MIN;
  if (width > max) width = max;

  left.style.width = width + "px";
});

document.addEventListener("mouseup", () => {
  isDragging = false;
  document.body.style.cursor = "default";
});

function toggleEditor() {
  const panel = document.getElementById("codeEditorPanel");
  panel.classList.toggle("hidden");
}

/* Restore state from a shared link, if one was opened */
loadFromShareLink();

</script>
</body>
</html>
